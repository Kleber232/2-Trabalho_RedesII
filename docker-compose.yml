services:
  server-http1:
    image: tp2-nginx-netem:local
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: server_http11
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx/http1.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      net_bench:
        ipv4_address: 172.20.0.10

  server-http2:
    image: tp2-nginx-netem:local
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: server_http2_tls
    cap_add:
      - NET_ADMIN
    ports:
      - "8443:443"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/http2.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      net_bench:
        ipv4_address: 172.20.0.20

  server-http3:
    image: tp2-caddy-netem:local
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: server_http3_quic
    cap_add:
      - NET_ADMIN
    ports:
      - "9443:443/tcp"
      - "9443:443/udp"
    volumes:
      - ./www:/srv:ro
      - ./certs:/etc/caddy/certs:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      net_bench:
        ipv4_address: 172.20.0.30

  benchmark-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: benchmark_client
    cap_add:
      - NET_ADMIN
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: ["sleep", "infinity"]
    networks:
      net_bench:
        ipv4_address: 172.20.0.40

networks:
  net_bench:
    name: net_bench
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
